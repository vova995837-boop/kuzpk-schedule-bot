<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17252b">
  <title>Степаша · Расписание</title>
  <link rel="icon" href="./stepasha-avatar.jpg">
  <link rel="stylesheet" href="./shell.css?v=board1">
  <link rel="stylesheet" href="./agenda.css?v=board1">
  <link rel="stylesheet" href="./notebook.css?v=board1">
  <script defer src="https://telegram.org/js/telegram-web-app.js"></script>
  <script defer src="./shell.js?v=kemtip"></script>
  <script defer src="./agenda.js?v=group2"></script>
  <script defer src="./notebook.js?v=calendar1"></script>
</head>
<body>
  <a class="skip-link" href="#screen">К содержимому</a>
  <div class="layout">
    <header class="mast">
      <div class="identity">
        <span class="signet" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="wordmark">Степаша</span>
      </div>
      <nav class="destinations" aria-label="Основные разделы">
        <button type="button" data-route="day" aria-current="page"><span data-icon="calendar"></span>Расписание</button>
        <button type="button" data-route="search"><span data-icon="search"></span>Поиск</button>
        <button type="button" data-route="notebook"><span data-icon="book"></span>Блокнот</button>
      </nav>
      <div class="school" hidden><span class="school-dot" aria-hidden="true"></span><span id="school-name"></span></div>
    </header>
    <main id="screen" tabindex="-1">
      <p class="boot">Открываем расписание…</p>
      <noscript>Для просмотра расписания включи JavaScript.</noscript>
    </main>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>
</body>
</html>
