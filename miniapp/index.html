<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111214"><title>Степаша · расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--ink:#f5f4f2;--muted:#999a9d;--line:#ffffff14;--hot:#ff744b;--mint:#8de0d1;--bg:#111214;--surface:#1b1c1f}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 15% 0%,#34251e 0,transparent 30%),radial-gradient(ellipse at 100% 35%,#182329 0,transparent 34%),var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}main{max-width:620px;margin:auto;padding:14px 16px 110px}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border:1px solid var(--line);border-radius:22px;background:#202124d9;backdrop-filter:blur(22px);box-shadow:0 12px 36px #0005}.brand{display:flex;align-items:center;gap:11px}.brandmark{width:40px;height:40px;display:grid;place-items:center;border-radius:14px;background:linear-gradient(145deg,#ff764d,#f4ab75);color:#211410;box-shadow:0 5px 20px #ff704133}.brandmark svg{width:25px;height:25px;stroke-width:1.5}.top h1{font-size:15px;letter-spacing:1.2px;margin:0;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.avatar{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:14px;background:#ffffff08;color:#e2e0dc}.avatar svg{width:19px}.welcome{margin:25px 3px 19px}.eyebrow{font-size:10px;font-weight:700;letter-spacing:1.45px;color:#929397}.welcome h2{font-size:30px;line-height:1.05;letter-spacing:-1.15px;margin:7px 0}.welcome p{margin:8px 0 0;color:#a2a2a5;font-size:13px}.tabs{display:flex;gap:6px;margin:0 0 13px;padding:4px;overflow:auto;scrollbar-width:none;border:1px solid #ffffff0b;border-radius:16px;background:#ffffff05}.tabs::-webkit-scrollbar{display:none}.tab{border:0;border-radius:12px;padding:10px 12px;background:transparent;color:#a6a6a9;font-size:12px;font-weight:650;white-space:nowrap;transition:background .18s,color .18s}.tab.active{background:#303135;color:#fff;box-shadow:0 2px 8px #0004}.glass{padding:16px;border:1px solid var(--line);border-radius:23px;background:linear-gradient(145deg,#252629e8,#1b1c1fe8);box-shadow:0 18px 42px #0005;backdrop-filter:blur(20px);animation:fadeUp .28s ease both}.heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.heading h2{font-size:18px;letter-spacing:-.35px;margin:4px 0 0}.select{max-width:150px;padding:10px 11px;border:1px solid var(--line);border-radius:12px;background:#ffffff0a;font-size:12px}.select option{background:#202124;color:white}.search-wrap{position:relative;display:block;margin:15px 0 10px}.search-wrap svg{position:absolute;left:13px;top:12px;width:18px;color:#8f9093}.search{width:100%;height:43px;padding:0 14px 0 40px;border:1px solid var(--line);border-radius:13px;background:#131416;color:var(--ink);outline:none}.search::placeholder{color:#77787b}.search:focus{border-color:#ff805f77;box-shadow:0 0 0 3px #ff805f12}.datebar{display:flex;align-items:center;justify-content:space-between;margin:15px 0 10px;padding:8px 9px;border:1px solid #ffffff0c;border-radius:15px;background:#ffffff06}.datebar>div{text-align:center}.datebar b{display:block;text-transform:capitalize;font-size:13px}.datebar small{display:block;color:#88898c;font-size:10px;margin-top:2px}.datebar button{display:grid;place-items:center;width:35px;height:35px;border:1px solid #ffffff10;border-radius:11px;background:#ffffff08;color:#e8e7e4}.datebar button svg{width:17px;height:17px}.lesson{padding:14px;margin-top:9px;border:1px solid #ffffff0b;border-radius:16px;background:#ffffff06;transition:transform .18s,border-color .18s}.lesson:first-child{border-color:#ff805f35;background:linear-gradient(110deg,#ff744b16,#ffffff06 70%)}.lesson:active{transform:scale(.99)}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:9px}.row b{font-size:13px;line-height:1.4;font-weight:680}.star{flex:none;width:32px;height:32px;display:grid;place-items:center;border:1px solid #ffffff12;border-radius:10px;background:#ffffff08;color:#eabf7a;font-size:19px;line-height:1}.meta{margin-top:7px;color:#a3a3a6;font-size:11px}.time-pill{display:inline-flex;padding:4px 8px;border:1px solid #8de0d122;border-radius:8px;background:#8de0d10d;color:var(--mint);font-size:11px;font-weight:700}.empty,.hint{padding:26px 14px;text-align:center;color:#929397;font-size:13px}.listitem{width:100%;display:flex;justify-content:space-between;align-items:center;margin:7px 0;padding:14px;border:1px solid #ffffff10;border-radius:14px;background:#ffffff07;text-align:left;transition:.18s}.listitem:active{background:#ffffff11;transform:scale(.99)}.bottom{position:fixed;z-index:2;bottom:0;left:0;right:0;display:flex;justify-content:center;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#111214 45%,#111214d9 75%,transparent);backdrop-filter:blur(14px)}.bottom nav{display:flex;width:min(100%,440px);justify-content:space-around;padding:6px;border:1px solid #ffffff16;border-radius:18px;background:#292a2ddf;box-shadow:0 8px 28px #0008}.bottom button{display:flex;flex:1;flex-direction:column;align-items:center;gap:4px;padding:8px 4px;border:0;border-radius:13px;background:transparent;color:#9a9a9e;transition:.2s}.bottom button svg{width:19px;height:19px}.bottom button span{font-size:9px;font-weight:600}.bottom button.active{background:#ff744b1c;color:#ff9878}.bottom button.active svg{filter:drop-shadow(0 0 5px #ff744b55)}@keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}@media(min-width:600px){main{padding-top:26px}.welcome h2{font-size:34px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head>
<body><main>
<header class="top"><div class="brand"><div class="brandmark"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 10.5 3.7 7a2 2 0 0 1 3.8-1.2L9 9m10 1.5L20.3 7a2 2 0 0 0-3.8-1.2L15 9M5 11c0-3.2 3.1-5 7-5s7 1.8 7 5v3.2c0 3.3-3.1 5.8-7 5.8s-7-2.5-7-5.8V11Z"/><path d="M9 13h.01M15 13h.01M10 16c1.2 1 2.8 1 4 0"/></svg></div><div><h1>СТЕПАША</h1><div class="sub" id="college">Твой колледж · помощник</div></div></div><button class="avatar" aria-label="Уведомления"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg></button></header>
<section class="welcome"><div class="eyebrow">ТВОЙ УЧЕБНЫЙ ДЕНЬ</div><h2>Расписание</h2><p>Пары, преподаватели и кабинеты — всё под рукой.</p></section>
<div class="tabs" id="tabs"><button class="tab active" data-section="schedule">Расписание</button><button class="tab" data-section="teachers">Преподаватели</button><button class="tab" data-section="rooms">Кабинеты</button><button class="tab" data-section="favorites">Избранное</button></div>
<section class="glass"><div class="heading"><div><div class="eyebrow" id="sectionLabel">МОЯ ГРУППА</div><h2 id="title">Моё расписание</h2></div><select id="group" class="select" hidden></select></div><label class="search-wrap" id="searchWrap" hidden><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input class="search" id="search" placeholder="Поиск группы…"></label><div class="datebar"><button id="prev" aria-label="Предыдущий день"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div><b id="dateLabel">Сегодня</b><small id="dateSub">День недели</small></div><button id="next" aria-label="Следующий день"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div><div id="content"><div class="hint">Загрузка расписания…</div></div></section>
</main><footer class="bottom"><nav><button class="active" data-section="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9h18m-13 4h3m-3 4h7"/></svg><span>Расписание</span></button><button data-section="teachers"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="8" r="4"/><path d="M3 21v-1.5a7.5 7.5 0 0 1 15 0V21m1-13a4 4 0 0 1 0 8m2 5v-1.5a5 5 0 0 0-2-4"/></svg><span>Поиск</span></button><button data-section="favorites"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg><span>Избранное</span></button></nav></footer>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';let section='schedule',day=new Date(),data={items:[],rows:[]},selectedName='',selectedGroup='',favorites=JSON.parse(localStorage.getItem('stepasha-favs')||'[]');
const $=s=>document.querySelector(s);const dateISO=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(section==='favorites'){renderFavorites();return}const params=new URLSearchParams({section,date:dateISO(day)});if(section==='schedule'&&selectedGroup)params.set('group',selectedGroup);if((section==='teachers'||section==='rooms')&&selectedName)params.set('name',selectedName);const q=$('#search').value.trim();if(q)params.set('q',q);try{const r=await fetch('/api/miniapp?'+params,{headers:{'X-Telegram-Init-Data':initData}});data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось загрузить данные');render()}catch(e){$('#content').innerHTML=`<div class="empty">${esc(e.message)}<br><small>Открой Mini App из Telegram и выбери группу в боте.</small></div>`}}
function render(){const names=data.items||[];$('#college').textContent=(data.college||'')+' · расписание';$('#dateLabel').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(day);$('#dateSub').textContent=day.toDateString()===new Date().toDateString()?'Сегодня':new Intl.DateTimeFormat('ru-RU',{year:'numeric'}).format(day);$('#group').hidden=section!=='schedule';$('#searchWrap').hidden=section==='schedule';$('#search').placeholder=section==='teachers'?'Найти преподавателя…':'Найти кабинет…';$('#sectionLabel').textContent=section==='schedule'?'МОЯ ГРУППА':section==='teachers'?'ПОИСК ПРЕПОДАВАТЕЛЯ':'ПОИСК АУДИТОРИИ';if(section==='schedule'){const sel=$('#group');sel.innerHTML='<option value="">Моя группа</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');if(selectedGroup)sel.value=selectedGroup;$('#title').textContent='Моё расписание'}else{$('#title').textContent=section==='teachers'?'Преподаватели':section==='rooms'?'Кабинеты':'Избранное'}let html='';if(section!=='schedule'&&!selectedName){html=names.map(n=>`<button class="listitem" data-name="${esc(n)}"><span>${esc(n)}</span><span>›</span></button>`).join('')||'<div class="empty">Совпадений не найдено</div>'}else{const rows=data.rows||[];html=rows.map(r=>{const key=[section,selectedName||selectedGroup,r.date,r.lesson_no,r.subject].join('|');return `<article class="lesson"><div class="row"><b>${esc(r.lesson_no||'—')} пара <span style="color:#777">·</span> ${esc(r.subject||'Занятие')}</b><button class="star" aria-label="В избранное" data-fav="${esc(key)}">${favorites.includes(key)?'★':'☆'}</button></div><div class="meta"><span class="time-pill">${esc(r.start||'Время не указано')}${r.end?' — '+esc(r.end):''}</span>${r.group?`　${esc(r.group)}`:''}</div><div class="meta">${r.teacher?`<span>Преподаватель</span>　${esc(r.teacher)}`:''}${r.room?`<br><span>Аудитория</span>　${esc(r.room)}`:''}</div></article>`}).join('')||'<div class="empty">Занятий на этот день нет</div>'}$('#content').innerHTML=html;$('#content').querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{selectedName=b.dataset.name;load()});$('#content').querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const k=b.dataset.fav;favorites=favorites.includes(k)?favorites.filter(x=>x!==k):[...favorites,k];localStorage.setItem('stepasha-favs',JSON.stringify(favorites));render()})}
function renderFavorites(){$('#title').textContent='Избранное';$('#group').hidden=true;$('#search').hidden=true;$('#dateLabel').textContent='Сохранено на устройстве';$('#content').innerHTML=favorites.map(f=>`<div class="listitem">⭐ ${esc(f.split('|').slice(0,3).join(' · '))}</div>`).join('')||'<div class="empty">Пока пусто. Нажми ☆ возле занятия.</div>'}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;selectedName='';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.section===section));document.querySelectorAll('.bottom button').forEach(t=>t.classList.toggle('active',t.dataset.section===section));load()});$('#prev').onclick=()=>{day.setDate(day.getDate()-1);load()};$('#next').onclick=()=>{day.setDate(day.getDate()+1);load()};$('#group').onchange=e=>{selectedGroup=e.target.value;load()};let timer;$('#search').oninput=()=>{clearTimeout(timer);selectedName='';timer=setTimeout(load,250)};load();
</script></body></html>
