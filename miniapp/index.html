<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111214"><title>Степаша · расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--bg:#111214;--panel:#202124;--ink:#f5f4f2;--muted:#a1a1a4;--line:#ffffff18;--accent:#ff754c;--mint:#8de0d1}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 12% 0,#35271f 0,transparent 34%),var(--bg);color:var(--ink);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit;color:inherit}button{cursor:pointer}svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}main{max-width:560px;margin:auto;padding:12px 15px calc(100px + env(safe-area-inset-bottom))}.top{display:flex;align-items:center;justify-content:space-between;padding:11px 13px;border:1px solid var(--line);border-radius:18px;background:#202124e8}.brand{display:flex;align-items:center;gap:10px}.brandmark{width:36px;height:36px;overflow:hidden;border-radius:11px;background:#333}.brandmark img{display:block;width:100%;height:100%;object-fit:cover}.top h1{margin:0;font-size:14px;letter-spacing:1px}.sub{margin-top:2px;color:var(--muted);font-size:11px}.avatar{display:grid;place-items:center;width:34px;height:34px;border:1px solid var(--line);border-radius:11px;background:#ffffff08}.avatar svg{width:18px}.welcome{margin:18px 2px 13px}.eyebrow{color:#a2a2a5;font-size:9px;font-weight:700;letter-spacing:1.2px}.welcome h2{margin:5px 0;font-size:25px;letter-spacing:-.6px}.welcome p{margin:4px 0 0;color:var(--muted);font-size:12px}.tabs{display:flex;gap:4px;margin:0 0 10px;padding:3px;overflow-x:auto;scrollbar-width:none;border:1px solid #ffffff10;border-radius:13px;background:#ffffff06}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;padding:8px 9px;border:0;border-radius:10px;background:transparent;color:#b1b1b3;font-size:10px;white-space:nowrap}.tab.active{background:#ffffff16;color:#fff}.glass{padding:14px;border:1px solid var(--line);border-radius:19px;background:linear-gradient(145deg,#252629,#1b1c1f);box-shadow:0 12px 28px #0003}.heading{display:flex;align-items:center;justify-content:space-between;gap:8px}.heading h2{margin:4px 0 0;font-size:16px}.select{max-width:145px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#111214;font-size:11px}.select option{background:#202124}.quick-actions{display:flex;gap:6px;margin:9px 0 2px;overflow:auto}.quick-actions button{flex:0 0 auto;padding:7px 9px;border:1px solid var(--line);border-radius:10px;background:#ffffff08;color:#ddd;font-size:10px}.search-wrap{position:relative;display:block;margin:12px 0 8px}.search-wrap svg{position:absolute;left:11px;top:11px;width:17px;color:#999}.search{width:100%;height:40px;padding:0 12px 0 36px;border:1px solid var(--line);border-radius:11px;background:#111214;outline:none}.search:focus{border-color:var(--accent)}.datebar{display:flex;align-items:center;justify-content:space-between;margin:10px 0 8px;padding:6px;border:1px solid #ffffff10;border-radius:13px;background:#ffffff06}.datebar>div{text-align:center}.datebar b{display:block;text-transform:capitalize;font-size:12px}.datebar small{display:block;margin-top:2px;color:var(--muted);font-size:9px}.datebar button{display:grid;place-items:center;width:32px;height:32px;border:1px solid var(--line);border-radius:9px;background:#ffffff08}.datebar button svg{width:16px}.status-card{margin:8px 0;padding:9px;border:1px solid #8de0d133;border-radius:11px;background:#8de0d10c;color:#bcefe5;font-size:11px}.lesson{margin-top:7px;padding:12px;border:1px solid #ffffff10;border-radius:14px;background:#ffffff06}.lesson:first-child{border-color:#ff805f35;background:linear-gradient(110deg,#ff744b14,#ffffff06)}.lesson.current{border-color:var(--accent);box-shadow:0 0 0 1px #ff754c33}.row{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.row b{font-size:12px;line-height:1.4}.star{flex:none;width:29px;height:29px;border:1px solid var(--line);border-radius:9px;background:#ffffff08;color:#efc477;font-size:18px}.meta{margin-top:6px;color:#b2b2b4;font-size:10px}.time-pill{display:inline-flex;padding:4px 7px;border-radius:7px;background:#8de0d111;color:var(--mint);font-size:10px;font-weight:700}.lesson-note{width:100%;margin-top:8px;padding:7px 9px;border:1px solid #ffffff12;border-radius:9px;background:#111214;font-size:10px}.week-day{margin-top:12px}.week-day h3{display:flex;justify-content:space-between;margin:0 2px 6px;font-size:12px}.week-day h3 span{color:var(--muted);font-size:10px;font-weight:400}.gap{padding:8px;border:1px dashed #ffffff1a;border-radius:10px;color:#999;text-align:center;font-size:10px}.empty,.hint{padding:22px 12px;color:var(--muted);text-align:center;font-size:12px}.listitem{display:flex;width:100%;justify-content:space-between;margin:6px 0;padding:12px;border:1px solid var(--line);border-radius:12px;background:#ffffff08;text-align:left}.bottom{position:fixed;z-index:2;right:0;bottom:0;left:0;display:flex;justify-content:center;padding:8px 15px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#111214 60%,#111214d9)}.bottom nav{display:flex;width:min(100%,430px);justify-content:space-around;padding:4px;border:1px solid var(--line);border-radius:15px;background:#252629f2}.bottom button{display:flex;flex:1;flex-direction:column;align-items:center;gap:3px;padding:6px 3px;border:0;border-radius:11px;background:transparent;color:#aaa}.bottom button svg{width:17px;height:17px}.bottom button span{font-size:8px}.bottom button.active{background:#ff754c20;color:#ff9878}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;animation:none!important;transition:none!important}}
</style></head>
<body><main>
<header class="top"><div class="brand"><div class="brandmark"><img src="/stepasha-avatar.jpg" alt="Степаша"></div><div><h1>СТЕПАША</h1><div class="sub" id="college">Твой колледж · помощник</div></div></div><button class="avatar" aria-label="Уведомления"><svg viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9ZM10 21h4"/></svg></button></header>
<section class="welcome"><div class="eyebrow">ТВОЙ УЧЕБНЫЙ ДЕНЬ</div><h2>Расписание</h2><p>Пары, преподаватели и кабинеты — всё под рукой.</p></section>
<div class="tabs" id="tabs"><button class="tab active" data-section="schedule">День</button><button class="tab" data-section="week">Неделя</button><button class="tab" data-section="teachers">Преподаватели</button><button class="tab" data-section="rooms">Кабинеты</button><button class="tab" data-section="favorites">Избранное</button></div>
<section class="glass"><div class="heading"><div><div class="eyebrow" id="sectionLabel">МОЯ ГРУППА</div><h2 id="title">Моё расписание</h2></div><select id="group" class="select" hidden></select></div><div id="quickActions" class="quick-actions"><button id="tomorrow">Завтра</button><button id="nextWeek">Следующая неделя</button><button id="refresh">Обновить</button></div><label class="search-wrap" id="searchWrap" hidden><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input class="search" id="search" placeholder="Поиск группы…"></label><div class="datebar"><button id="prev" aria-label="Предыдущий день"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div><b id="dateLabel">Сегодня</b><small id="dateSub">День недели</small></div><button id="next" aria-label="Следующий день"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div><div id="statusCard" class="status-card" hidden></div><div id="content"><div class="hint">Загрузка расписания…</div></div></section>
</main><footer class="bottom"><nav><button class="active" data-section="schedule"><svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 9h18m-13 4h3m-3 4h7"/></svg><span>Расписание</span></button><button data-section="teachers"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="8" r="4"/><path d="M3 21v-1.5a7.5 7.5 0 0 1 15 0V21m1-13a4 4 0 0 1 0 8m2 5v-1.5a5 5 0 0 0-2-4"/></svg><span>Поиск</span></button><button data-section="favorites"><svg viewBox="0 0 24 24"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-3-5.6 3 1.1-6.2L3 9.6l6.2-.9L12 3Z"/></svg><span>Избранное</span></button></nav></footer>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';let section='schedule',mode='day',day=new Date(),data={items:[],rows:[]},weekData={},selectedName='',selectedGroup='',favorites=JSON.parse(localStorage.getItem('stepasha-favs')||'[]'),tasks=JSON.parse(localStorage.getItem('stepasha-tasks')||'[]'),subjectFilter='all';
const $=s=>document.querySelector(s);const dateISO=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(section==='favorites'){renderFavorites();return}const apiSection=section==='week'?'week':section;const params=new URLSearchParams({section:apiSection,date:dateISO(day)});if(selectedGroup)params.set('group',selectedGroup);if((section==='teachers'||section==='rooms')&&selectedName)params.set('name',selectedName);const q=$('#search').value.trim();if(q)params.set('q',q);try{const r=await fetch('/api/miniapp?'+params,{headers:{'X-Telegram-Init-Data':initData}});data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось загрузить данные');if(section==='week')weekData=data.days||{};render()}catch(e){$('#content').innerHTML=`<div class="empty">${esc(e.message)}<br><small>Открой Mini App из Telegram и выбери группу в боте.</small></div>`}}
function toMinutes(t){const m=String(t||'').match(/(\d{1,2}):(\d{2})/);return m?+m[1]*60+ +m[2]:null}function timeLeft(min){const d=Math.max(0,min);return d<60?`${d} мин.`:`${Math.floor(d/60)} ч ${d%60} мин.`}function decorate(rows,dateKey){return (rows||[]).map(r=>{const start=toMinutes(r.start),end=toMinutes(r.end),now=new Date(),isToday=dateKey===dateISO(now),m=now.getHours()*60+now.getMinutes();return {...r,_current:isToday&&start!==null&&end!==null&&m>=start&&m<end,_next:isToday&&start!==null&&m<start}})}
function render(){const names=data.items||[];$('#college').textContent=(data.college||'')+' · расписание';$('#dateLabel').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(day);$('#dateSub').textContent=day.toDateString()===new Date().toDateString()?'Сегодня':new Intl.DateTimeFormat('ru-RU',{year:'numeric'}).format(day);$('#group').hidden=!['schedule','week','teachers'].includes(section);$('#searchWrap').hidden=!['teachers','rooms'].includes(section);$('#quickActions').hidden=!['schedule','week'].includes(section);$('#search').placeholder=section==='teachers'?'Найти преподавателя…':'Найти кабинет…';$('#sectionLabel').textContent=['schedule','week'].includes(section)?'МОЯ ГРУППА':section==='teachers'?'ПОИСК ПРЕПОДАВАТЕЛЯ':'ПОИСК АУДИТОРИИ';if(['schedule','week','teachers'].includes(section)){const sel=$('#group');const groupOptions=[...new Set([data.group,...(section==='teachers'?(data.groups||[]):names)].filter(Boolean))];sel.innerHTML='<option value="">Моя группа</option>'+groupOptions.map(n=>`<option value="${esc(n)}">${esc(n)}</option>`).join('');sel.value=selectedGroup;$('#title').textContent=section==='week'?'Неделя':section==='teachers'&&selectedName?selectedName:section==='teachers'?'Преподаватели':'Моё расписание'}else{$('#title').textContent=selectedName||'Кабинеты'}let html='';if(section==='week'){const days=Object.entries(weekData).sort(([a],[b])=>a.localeCompare(b));html=days.map(([d,rows])=>{const dt=new Date(d+'T12:00:00');return `<section class="week-day"><h3>${new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'short'}).format(dt)}<span>${rows.length?rows.length+' пар':'Свободно'}</span></h3>${cardList(rows,d)}</section>`}).join('')}else if(['teachers','rooms'].includes(section)&&!selectedName){html=names.map(n=>`<button class="listitem" data-name="${esc(n)}"><span>${esc(n)}</span><span>›</span></button>`).join('')||'<div class="empty">Совпадений не найдено</div>'}else{html=cardList(data.rows||[],dateISO(day))}if(selectedName&&['teachers','rooms'].includes(section))html=`<button class="listitem" data-back="1"><span>‹ Все ${section==='teachers'?'преподаватели':'кабинеты'}</span><span>Вернуться</span></button>`+html;$('#content').innerHTML=html;wireCards();document.querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{selectedName=b.dataset.name;load()});document.querySelector('[data-back]')?.addEventListener('click',()=>{selectedName='';load()});updateStatus();}
function cardList(rows,dateKey){const items=decorate(rows,dateKey);let out='';let previousEnd=null;items.forEach((r,index)=>{const start=toMinutes(r.start);if(previousEnd!==null&&start!==null&&start>previousEnd){const gap=start-previousEnd;out+=`<div class="lesson gap">Окно · ${timeLeft(gap)}</div>`}previousEnd=toMinutes(r.end)||previousEnd;const key=[section,selectedName||selectedGroup,r.date||dateKey,r.lesson_no,r.subject].join('|');let kind=String(r.lesson_type||r.type||'').toLowerCase();if(subjectFilter!=='all'&&!kind.includes(subjectFilter))return;out+=`<article class="lesson ${r._current?'current':''}" style="--subject-hue:${(String(r.subject||'').split('').reduce((a,c)=>a+c.charCodeAt(0),0)*17)%360}"><div class="row"><b>${esc(r.lesson_no||'—')} пара <span style="color:#777">·</span> ${esc(r.subject||'Занятие')}</b><button class="star" aria-label="В избранное" data-fav="${esc(key)}">${favorites.includes(key)?'★':'☆'}</button></div><div class="meta"><span class="time-pill">${esc(r.start||'Время не указано')}${r.end?' — '+esc(r.end):''}</span>${r.group?`　${esc(r.group)}`:''}${r._current?'　· Сейчас':''}</div><div class="meta">${r.teacher?`Преподаватель　${esc(r.teacher)}`:''}${r.room?`<br>Аудитория　${esc(r.room)}`:''}</div><input class="lesson-note" data-note="${esc(key)}" placeholder="Личная заметка к паре" value="${esc(localStorage.getItem('note:'+key)||'')}"></article>`});return out||'<div class="empty">Занятий на этот день нет</div>'}
function updateStatus(){const box=$('#statusCard');if(section!=='schedule'){box.hidden=true;return}const rows=decorate(data.rows||[],dateISO(day));const current=rows.find(r=>r._current),next=rows.find(r=>r._next);box.hidden=!current&&!next;if(current){const remain=toMinutes(current.end)-new Date().getHours()*60-new Date().getMinutes();box.textContent=`Сейчас идёт ${current.lesson_no} пара · до конца ${timeLeft(remain)}`}else if(next){const remain=toMinutes(next.start)-new Date().getHours()*60-new Date().getMinutes();box.textContent=`Следующая пара через ${timeLeft(remain)} · ${next.subject}`}}
function renderFavorites(){$('#title').textContent='Избранное';$('#group').hidden=true;$('#search').hidden=true;$('#dateLabel').textContent='Сохранено на устройстве';$('#content').innerHTML=favorites.map(f=>`<div class="listitem">⭐ ${esc(f.split('|').slice(0,3).join(' · '))}</div>`).join('')||'<div class="empty">Пока пусто. Нажми ☆ возле занятия.</div>'}
function wireCards(){document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const k=b.dataset.fav;favorites=favorites.includes(k)?favorites.filter(x=>x!==k):[...favorites,k];localStorage.setItem('stepasha-favs',JSON.stringify(favorites));load()});document.querySelectorAll('[data-note]').forEach(i=>i.onchange=()=>localStorage.setItem('note:'+i.dataset.note,i.value));}
function setSection(s){section=s;selectedName='';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.section===section));document.querySelectorAll('.bottom button').forEach(t=>t.classList.toggle('active',t.dataset.section===section));load()}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>setSection(b.dataset.section));$('#prev').onclick=()=>{day.setDate(day.getDate()-1);load()};$('#next').onclick=()=>{day.setDate(day.getDate()+1);load()};$('#group').onchange=e=>{selectedGroup=e.target.value;load()};$('#tomorrow').onclick=()=>{day=new Date();day.setDate(day.getDate()+1);section='schedule';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.section==='schedule'));load()};$('#nextWeek').onclick=()=>{day=new Date();day.setDate(day.getDate()-day.getDay()+8);section='week';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.section==='week'));load()};$('#refresh').onclick=()=>load();let timer;$('#search').oninput=()=>{clearTimeout(timer);selectedName='';timer=setTimeout(load,250)};setInterval(()=>{if(section==='schedule'){updateStatus();}},30000);load();
</script></body></html>
