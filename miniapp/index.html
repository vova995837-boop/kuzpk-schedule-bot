<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#b4ff35"><title>Степаша · расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--ink:#10232e;--lime:#b7ff38;--mint:#bdf4e5;--pink:#ffd2ef;--blue:#69b9e8;--glass:rgba(255,255,255,.44)}*{box-sizing:border-box}body{margin:0;font:15px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 10% 5%,#eeffbc 0,transparent 35%),radial-gradient(ellipse at 95% 25%,#bcefe4 0,transparent 38%),linear-gradient(145deg,#f8fff0,#d8fff5 60%,#d1eaff);min-height:100vh}main{max-width:680px;margin:auto;padding:18px 16px 100px}.top{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-radius:26px;background:var(--lime);box-shadow:0 12px 32px #789b4540}.top h1{font-size:21px;margin:0}.sub{font-size:12px;opacity:.7}.avatar{width:42px;height:42px;border-radius:50%;background:#fff8;display:grid;place-items:center;font-size:22px}.tabs{display:flex;gap:8px;margin:16px 0;overflow:auto}.tab{border:0;border-radius:999px;padding:10px 15px;background:#ffffff99;color:var(--ink);font-weight:700;white-space:nowrap}.tab.active{background:var(--ink);color:white}.glass{background:var(--glass);border:1px solid #ffffffb5;box-shadow:0 14px 35px #557d7130;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-radius:25px;padding:17px;margin:12px 0;animation:rise .32s ease both}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading h2{margin:0;font-size:19px}.search{width:100%;padding:13px 15px;border:1px solid #ffffffb5;border-radius:16px;background:#ffffff9c;font:inherit;outline:none;margin:12px 0}.datebar{display:flex;justify-content:space-between;align-items:center;margin-top:15px}.datebar button,.select{border:0;background:#ffffffa6;border-radius:14px;padding:9px 12px;color:var(--ink);font:inherit}.lesson{padding:14px;border-radius:19px;margin-top:10px}.lesson:nth-child(3n){background:#b7ff38aa}.lesson:nth-child(3n+1){background:#ffd2efbb}.lesson:nth-child(3n+2){background:#b8eee0cc}.meta{font-size:12px;opacity:.7;margin-top:4px}.row{display:flex;gap:9px;align-items:center}.star{border:0;background:#ffffffa8;border-radius:12px;font-size:20px;padding:6px 9px}.empty,.hint{text-align:center;opacity:.65;padding:25px}.listitem{padding:13px;border-radius:16px;background:#ffffff80;margin:8px 0;display:flex;justify-content:space-between;align-items:center}.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#e9fff0a8;backdrop-filter:blur(20px);display:flex;justify-content:center}.bottom nav{display:flex;gap:6px;padding:6px;background:#ffffffb0;border-radius:20px;box-shadow:0 8px 28px #4d796033}.bottom button{border:0;background:transparent;padding:10px 13px;border-radius:14px;font:inherit;color:var(--ink)}.bottom button.active{background:var(--lime)}@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important}}
</style></head>
<body><main>
<header class="top"><div><h1>Привет, студент! 🐶</h1><div class="sub" id="college">Степаша · твой помощник</div></div><div class="avatar">🐾</div></header>
<div class="tabs" id="tabs"><button class="tab active" data-section="schedule">Расписание</button><button class="tab" data-section="teachers">Преподаватели</button><button class="tab" data-section="rooms">Кабинеты</button><button class="tab" data-section="favorites">Избранное</button></div>
<section class="glass"><div class="heading"><h2 id="title">Моё расписание</h2><select id="group" class="select" hidden></select></div><input class="search" id="search" placeholder="Поиск группы…" hidden><div class="datebar"><button id="prev">‹</button><b id="dateLabel">Сегодня</b><button id="next">›</button></div><div id="content"><div class="hint">Загружаю расписание…</div></div></section>
</main><footer class="bottom"><nav><button class="active" data-section="schedule">🏠</button><button data-section="teachers">🔎</button><button data-section="favorites">⭐</button></nav></footer>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';let section='schedule',day=new Date(),data={items:[],rows:[]},selectedName='',selectedGroup='',favorites=JSON.parse(localStorage.getItem('stepasha-favs')||'[]');
const $=s=>document.querySelector(s);const dateISO=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(section==='favorites'){renderFavorites();return}const params=new URLSearchParams({section,date:dateISO(day)});if(section==='schedule'&&selectedGroup)params.set('group',selectedGroup);if((section==='teachers'||section==='rooms')&&selectedName)params.set('name',selectedName);const q=$('#search').value.trim();if(q)params.set('q',q);try{const r=await fetch('/api/miniapp?'+params,{headers:{'X-Telegram-Init-Data':initData}});data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось загрузить данные');render()}catch(e){$('#content').innerHTML=`<div class="empty">${esc(e.message)}<br><small>Открой Mini App из Telegram и выбери группу в боте.</small></div>`}}
function render(){const names=data.items||[];$('#college').textContent=(data.college||'')+' · расписание';$('#dateLabel').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(day);$('#group').hidden=section!=='schedule';$('#search').hidden=section==='schedule';$('#search').placeholder=section==='teachers'?'Найти преподавателя…':'Найти кабинет…';if(section==='schedule'){const sel=$('#group');sel.innerHTML='<option value="">Моя группа</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');if(selectedGroup)sel.value=selectedGroup;$('#title').textContent='Расписание'}else{$('#title').textContent=section==='teachers'?'Преподаватели':'Кабинеты'}let html='';if(section!=='schedule'&&!selectedName){html=names.map(n=>`<button class="listitem" data-name="${esc(n)}"><span>${esc(n)}</span><span>›</span></button>`).join('')||'<div class="empty">Ничего не найдено</div>'}else{const rows=data.rows||[];html=rows.map(r=>{const key=[section,selectedName||selectedGroup,r.date,r.lesson_no,r.subject].join('|');return `<article class="lesson"><div class="row"><b>${esc(r.lesson_no||'—')} пара · ${esc(r.subject||'Занятие')}</b><button class="star" data-fav="${esc(key)}">${favorites.includes(key)?'★':'☆'}</button></div><div class="meta">${esc(r.start||'')} ${r.end?'– '+esc(r.end):''} · ${esc(r.group||'')}</div><div class="meta">${esc(r.teacher||'')} ${r.room?'· '+esc(r.room):''}</div></article>`}).join('')||'<div class="empty">Занятий на этот день нет</div>'}$('#content').innerHTML=html;$('#content').querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{selectedName=b.dataset.name;load()});$('#content').querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const k=b.dataset.fav;favorites=favorites.includes(k)?favorites.filter(x=>x!==k):[...favorites,k];localStorage.setItem('stepasha-favs',JSON.stringify(favorites));render()})}
function renderFavorites(){$('#title').textContent='Избранное';$('#group').hidden=true;$('#search').hidden=true;$('#dateLabel').textContent='Сохранено на устройстве';$('#content').innerHTML=favorites.map(f=>`<div class="listitem">⭐ ${esc(f.split('|').slice(0,3).join(' · '))}</div>`).join('')||'<div class="empty">Пока пусто. Нажми ☆ возле занятия.</div>'}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;selectedName='';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.section===section));document.querySelectorAll('.bottom button').forEach(t=>t.classList.toggle('active',t.dataset.section===section));load()});$('#prev').onclick=()=>{day.setDate(day.getDate()-1);load()};$('#next').onclick=()=>{day.setDate(day.getDate()+1);load()};$('#group').onchange=e=>{selectedGroup=e.target.value;load()};let timer;$('#search').oninput=()=>{clearTimeout(timer);selectedName='';timer=setTimeout(load,250)};load();
</script></body></html>
