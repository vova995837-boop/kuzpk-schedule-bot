.search-wrap{position:relative;display:block;margin:10px 0}.search-wrap svg{position:absolute;top:11px;left:12px;width:17px;color:#98929a}.search{width:100%;height:40px;padding:0 12px 0 37px;border:1px solid #e7e1da;border-radius:12px;background:#fff;font-size:11px;outline:none;transition:border-color .18s,box-shadow .18s}.entity-switch{display:flex;gap:5px;margin:9px 0}.entity-switch button{flex:1;padding:8px;border:1px solid #e7ded4;border-radius:11px;background:#fff9f2;color:#76717a;font-size:10px;font-weight:750}.entity-switch button.active{border-color:#f07861;background:#fff0e9;color:#a84b40}

.lesson{position:relative;display:grid;grid-template-columns:44px 1fr;gap:11px;margin-top:9px;padding:12px 11px;border:1px solid #ebe5df;border-radius:16px;background:#fff;transition:transform .2s,box-shadow .2s,border-color .2s;animation:card-in .35s both}.lesson:hover{transform:translateY(-2px);box-shadow:0 7px 17px #4433230d}.lesson.current{border-color:#f3a18b;background:#fff8f4;box-shadow:0 3px 0 #f4d9cf}.lesson-time{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;padding-top:2px;color:#5b5961;text-align:center}.lesson-time b{font-size:10px;font-weight:850}.lesson-time span{color:#89848a;font-size:9px}.timeline{position:absolute;top:48px;bottom:-11px;left:32px;width:1px;background:#e8e2dc}.lesson:last-child .timeline{display:none}.lesson-info{min-width:0}.lesson-title{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}.lesson-title strong{font-size:12px;font-weight:800;line-height:1.35}.lesson-number{display:block;margin-bottom:2px;color:#9a959a;font-size:9px;font-weight:750}.lesson-details{display:flex;flex-wrap:wrap;gap:5px;margin-top:7px}.detail-pill{display:inline-flex;align-items:center;gap:4px;padding:5px 7px;border-radius:8px;background:#f6f3ef;color:#66616a;font-size:9px;font-weight:650}.detail-pill svg{width:12px;height:12px}.detail-pill.time{background:#eaf3ef;color:#397260}.star{display:grid;place-items:center;width:27px;height:27px;flex:none;border:1px solid #eee4d9;border-radius:9px;background:#fffaf4;color:#cc7258;font-size:15px}.note{width:100%;margin-top:8px;padding:7px 9px;border:1px solid #eee7e0;border-radius:9px;background:#fffdfa;font-size:9px;outline:none}.gap{margin:8px 0 8px 54px;padding:7px 9px;border:1px dashed #ded5cc;border-radius:10px;background:#faf7f2;color:#837d7b;font-size:9px;text-align:center}.week-day{margin-top:13px}.week-day:first-child{margin-top:0}.week-day-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:5px;padding:0 2px}.week-day-head strong{font-size:11px;font-weight:850;text-transform:capitalize}.week-day-head span{color:#88838a;font-size:9px}

@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}@keyframes card-in{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}@keyframes puppy-in{from{opacity:0;transform:translateY(9px) rotate(2deg)}to{opacity:1;transform:translateY(0) rotate(0)}}

@media(max-width:340px){.hero{padding-right:100px}.hero-art{right:-10px;width:118px;height:130px}.hero h1{font-size:20px}.brand-sub{max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.group-chip{max-width:42%;font-size:9px}.bottom-nav button svg{width:15px;height:15px}}

<body>
<main>
<header class="topbar"><div class="brand"><div class="brand-logo">S.</div><div><div class="brand-title">СТЕПАША</div><div class="brand-sub" id="college">Учебный помощник</div></div></div><div class="group-chip" id="mainGroup">Моя группа</div></header>
<section class="hero"><div class="hero-copy"><div class="hero-date" id="heroDate">ТВОЙ УЧЕБНЫЙ ДЕНЬ</div><h1 id="heroTitle">План на сегодня</h1><div class="hero-status"><i class="live-dot"></i><span id="heroStatus">Загружаю расписание…</span></div><span class="hero-group" id="heroGroup">Открой расписание группы</span></div><img class="hero-art" src="/stepasha-planner.png" alt="Степаша с планером"></section>
<nav class="tabs" aria-label="Разделы"><button class="tab active" data-section="schedule"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3.5 9h17m-12 4h3m-3 4h7"/></svg>День</button><button class="tab" data-section="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 9h18M8 13h2m4 0h2m-8 4h2m4 0h2"/></svg>Неделя</button><button class="tab" data-section="teachers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0m3-11a3.5 3.5 0 0 1 0 7m1 1a5 5 0 0 1 2 4"/></svg>Люди</button><button class="tab" data-section="rooms"><svg viewBox="0 0 24 24"><path d="M4 21V4l8-2 8 2v17M4 8h16M9 21v-5h6v5m-7-9h.01m8 0h.01"/></svg>Кабинеты</button><button class="tab" data-section="favorites"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.2.9-4.5 4.4 1.1 6.2-5.5-3-5.5 3 1.1-6.2-4.5-4.4 6.2-.9L12 3Z"/></svg>Сохранено</button><button class="tab" data-section="tools"><svg viewBox="0 0 24 24"><path d="M4 5.5h16M4 12h16M4 18.5h10"/><circle cx="18" cy="18" r="3"/></svg>Инструменты</button></nav>
<section class="panel"><div class="panel-head"><div><div class="panel-kicker" id="sectionLabel">РАСПИСАНИЕ ГРУППЫ</div><h2 class="panel-title" id="title">Пары на сегодня</h2></div><div id="groupWrap"><select id="group" class="select" aria-label="Учебная группа" hidden></select></div></div>
<div class="quick" id="quick"><button id="tomorrow">Завтра</button><button id="nextWeek">Следующая неделя</button><button id="refresh">Обновить</button></div>
<label class="search-wrap" id="searchWrap" hidden><svg viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></svg><input class="search" id="search" placeholder="Найти преподавателя…"></label>

<div class="datebar" id="datebar"><button id="prev" aria-label="Предыдущий день"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button><div class="date-center"><b id="dateLabel">Сегодня</b><small id="dateSub">День недели</small></div><button id="next" aria-label="Следующий день"><svg viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></svg></button></div>
<div class="status" id="statusCard" hidden><span class="status-icon"><svg viewBox="0 0 24 24"><path d="M12 3v9l6 3"/><circle cx="12" cy="12" r="9"/></svg></span><span id="statusText"></span></div>
<div id="content"><div class="empty">Загружаю расписание…</div></div>
</section>
</main>
<footer class="bottom"><nav class="bottom-nav"><button class="active" data-section="schedule"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M8 2.5v4M16 2.5v4M3.5 9h17"/></svg><span>План</span></button><button data-section="week"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4m8-4v4M3 9h18"/></svg><span>Неделя</span></button><button data-section="teachers"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0m3-11a3.5 3.5 0 0 1 0 7m1 1a5 5 0 0 1 2 4"/></svg><span>Поиск</span></button><button data-section="favorites"><svg viewBox="0 0 24 24"><path d="m12 3 2.7 5.6 6.2.9-4.5 4.4 1.1 6.2-5.5-3-5.5 3 1.1-6.2-4.5-4.4 6.2-.9L12 3Z"/></svg><span>Избранное</span></button><button data-section="tools"><svg viewBox="0 0 24 24"><path d="M4 5.5h16M4 12h16M4 18.5h10"/><circle cx="18" cy="18" r="3"/></svg><span>Ещё</span></button></nav></footer>
<script>
const telegram = window.Telegram?.WebApp;
telegram?.ready();
telegram?.expand();
const initData = telegram?.initData || '';
const $ = selector => document.querySelector(selector);
const toISO = date => {
  const local = new Date(date.getTime() - date.getTimezoneOffset() * 60000);
  return local.toISOString().slice(0, 10);
};
const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, char => ({
  '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
}[char]));
const parseMinutes = value => {
  const match = String(value || '').match(/(\d{1,2}):(\d{2})/);
  return match ? Number(match[1]) * 60 + Number(match[2]) : null;
};
const formatDate = date => new Intl.DateTimeFormat('ru-RU', {
  weekday: 'long', day: 'numeric', month: 'long'
}).format(date);
const timeRemaining = value => value < 60
  ? `${value} мин.`
  : `${Math.floor(value / 60)} ч ${value % 60} мин.`;

let section = 'schedule';
let day = new Date();
let data = { items: [], groups: [], rows: [] };
let weekData = {};
let selectedName = '';
let selectedGroup = '';
let favorites = JSON.parse(localStorage.getItem('stepasha-favs') || '[]');
let tasks = JSON.parse(localStorage.getItem('stepasha-tasks') || '[]');
let grades = JSON.parse(localStorage.getItem('stepasha-grades') || '[]');
let studyEvents = JSON.parse(localStorage.getItem('stepasha-events') || '[]');

async function load() {
  if (section === 'favorites') return renderFavorites();
  if (section === 'tools') return renderTools();

  const params = new URLSearchParams({ section, date: toISO(day) });
  if (selectedGroup) params.set('group', selectedGroup);
  if (selectedName && (section === 'teachers' || section === 'rooms')) {
    params.set('name', selectedName);
  }
  const query = $('#search').value.trim();
  if (query && (section === 'teachers' || section === 'rooms')) params.set('q', query);

  try {
    const response = await fetch(`/api/miniapp?${params}`, {
      headers: { 'X-Telegram-Init-Data': initData }
    });
    data = await response.json();
    if (!response.ok) throw new Error(data.error || 'Не удалось загрузить расписание');
    if (section === 'week') weekData = data.days || {};
    render();
  } catch (error) {
    $('#content').innerHTML = `<div class="empty"><strong>Расписание временно недоступно</strong>${escapeHTML(error.message)}<br><small>Открой приложение из Telegram после выбора колледжа и группы.</small></div>`;
    $('#heroStatus').textContent = 'Не удалось подключиться к расписанию';
  }
}

function setSection(nextSection) {
  section = nextSection;
  selectedName = '';
  document.querySelectorAll('.tab').forEach(button => {
    button.classList.toggle('active', button.dataset.section === section);
  });
  document.querySelectorAll('.bottom-nav button').forEach(button => {
    const key = button.dataset.section;
    button.classList.toggle('active', key === section || (key === 'teachers' && section === 'rooms'));
  });
  load();
}

function updateHero() {
  $('#heroDate').textContent = formatDate(day);
  $('#mainGroup').textContent = data.group || selectedGroup || 'Моя группа';
  $('#heroGroup').textContent = data.group || selectedGroup || 'Выбери группу в боте';

  if (section === 'schedule') {
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    const rows = data.rows || [];
    const isToday = toISO(day) === toISO(now);
    const current = isToday && rows.find(row => {
      const start = parseMinutes(row.start), end = parseMinutes(row.end);
      return start !== null && end !== null && nowMinutes >= start && nowMinutes < end;
    });
    const next = isToday && rows.find(row => {
      const start = parseMinutes(row.start);
      return start !== null && nowMinutes < start;
    });
    $('#heroTitle').textContent = isToday ? 'Твой учебный день' : 'План на день';
    $('#heroStatus').textContent = current
      ? `Идёт ${current.lesson_no || ''} пара · ещё ${timeRemaining(parseMinutes(current.end) - nowMinutes)}`
      : next ? `Следующая пара через ${timeRemaining(parseMinutes(next.start) - nowMinutes)}`
      : rows.length ? 'На сегодня всё. Можно выдохнуть.' : 'Сегодня занятий нет';
    $('#statusText').textContent = current
      ? `${current.lesson_no || ''} пара · ${current.subject || current.lesson || 'Занятие'}`
      : next ? `Дальше: ${next.subject || next.lesson || 'Занятие'}` : 'Расписание группы обновлено';
    $('#statusCard').hidden = !current && !next;
    return;
  }

  $('#statusCard').hidden = true;
  const copy = {
    week: ['Вся неделя', 'План занятий по дням'],
    teachers: [selectedName || 'Люди колледжа', selectedName ? 'Расписание преподавателя' : 'Найди преподавателя по имени'],
    rooms: [selectedName || 'Аудитории', selectedName ? 'Расписание кабинета' : 'Найди нужный кабинет'],
    favorites: ['Избранное', 'Сохранённые пары всегда под рукой'],
    tools: ['Учебные инструменты', 'Задания, оценки и важные даты']
  }[section];
  $('#heroTitle').textContent = copy[0];
  $('#heroStatus').textContent = copy[1];
}

function render() {
  const items = data.items || [];
  $('#college').textContent = `${data.college || 'Колледж'} · учебный помощник`;
  $('#dateLabel').textContent = formatDate(day);
  $('#dateSub').textContent = toISO(day) === toISO(new Date())
    ? 'Сегодня' : new Intl.DateTimeFormat('ru-RU', { year: 'numeric' }).format(day);

  const needsGroup = ['schedule', 'week', 'teachers'].includes(section);
  $('#groupWrap').hidden = !needsGroup;
  $('#group').hidden = !needsGroup;
  if (needsGroup) {
    const groups = [...new Set([data.group, ...(section === 'teachers' ? data.groups || [] : items)].filter(Boolean))];
    $('#group').innerHTML = '<option value="">Моя группа</option>' + groups.map(group =>
      `<option value="${escapeHTML(group)}">${escapeHTML(group)}</option>`).join('');
    $('#group').value = selectedGroup;
  }

  $('#quick').hidden = !['schedule', 'week'].includes(section);
  $('#datebar').hidden = !['schedule', 'teachers', 'rooms'].includes(section);
  $('#searchWrap').hidden = !['teachers', 'rooms'].includes(section);
  $('#search').placeholder = section === 'rooms' ? 'Найти кабинет…' : 'Найти преподавателя…';
  $('#sectionLabel').textContent = {
    schedule: 'РАСПИСАНИЕ ГРУППЫ', week: 'ПЛАН НА НЕДЕЛЮ',
    teachers: 'ПРЕПОДАВАТЕЛИ', rooms: 'КАБИНЕТЫ',
    favorites: 'СОХРАНЁННОЕ', tools: 'МОИ ИНСТРУМЕНТЫ'
  }[section];
  $('#title').textContent = {
    schedule: 'Пары на сегодня', week: 'Неделя',
    teachers: selectedName || 'Поиск преподавателя', rooms: selectedName || 'Поиск кабинета',
    favorites: 'Сохранённые пары', tools: 'Для учёбы'
  }[section];

  let html = '';
  if (section === 'schedule') {
    html = lessonList(data.rows || [], toISO(day));
  } else if (section === 'week') {
    html = Object.entries(weekData).sort(([a], [b]) => a.localeCompare(b)).map(([date, rows]) => {
      const dayDate = new Date(`${date}T12:00:00`);
      return `<section class="week-day"><div class="week-day-head"><strong>${formatDate(dayDate)}</strong><span>${rows.length ? `${rows.length} пар` : 'Нет занятий'}</span></div>${lessonList(rows, date)}</section>`;
    }).join('') || empty('На эту неделю расписания пока нет');
  } else if (section === 'teachers' || section === 'rooms') {
    if (selectedName) {
      html = '<button class="listitem" data-back><span>‹ Вернуться к списку</span><span>Назад</span></button>' + lessonList(data.rows || [], toISO(day));
    } else {
      html = items.map(name => `<button class="listitem" data-name="${escapeHTML(name)}"><span>${escapeHTML(name)}</span><span>Посмотреть ›</span></button>`).join('') || empty('Ничего не найдено');
    }
  }

  $('#content').innerHTML = html;
  bindScheduleCards();
  updateHero();
}

function empty(message) {
  return `<div class="empty"><strong>${escapeHTML(message)}</strong>Попробуй выбрать другой день или группу.</div>`;
}

function lessonList(rows, date) {
  if (!rows?.length) return empty('Занятий нет');
  const currentMinutes = new Date().getHours() * 60 + new Date().getMinutes();
  const isToday = date === toISO(new Date());
  let output = '', previousEnd = null;
  rows.forEach((row, index) => {
    const start = parseMinutes(row.start), end = parseMinutes(row.end);
    if (previousEnd !== null && start !== null && start > previousEnd) {
      output += `<div class="gap">Окно · ${timeRemaining(start - previousEnd)}</div>`;
    }
    if (end !== null) previousEnd = end;
    const isCurrent = isToday && start !== null && end !== null && currentMinutes >= start && currentMinutes < end;
    const key = [section, selectedName || selectedGroup, row.date || date, row.lesson_no, row.subject || row.lesson].join('|');
    output += `<article class="lesson ${isCurrent ? 'current' : ''}" style="animation-delay:${Math.min(index, 7) * 35}ms">
      <div class="lesson-time"><b>${escapeHTML(row.start || '—')}</b><span>${escapeHTML(row.end || '')}</span><i class="timeline"></i></div>
      <div class="lesson-info"><div class="lesson-title"><div><span class="lesson-number">${escapeHTML(row.lesson_no || index + 1)} ПАРА</span><strong>${escapeHTML(row.subject || row.lesson || 'Занятие')}</strong></div>
      <button class="star" data-fav="${escapeHTML(key)}" aria-label="Сохранить пару">${favorites.includes(key) ? '★' : '☆'}</button></div>
      <div class="lesson-details">${row.group ? `<span class="detail-pill">${escapeHTML(row.group)}</span>` : ''}${row.teacher ? `<span class="detail-pill">${escapeHTML(row.teacher)}</span>` : ''}${row.room ? `<span class="detail-pill">Каб. ${escapeHTML(row.room)}</span>` : ''}</div>
      <input class="note" data-note="${escapeHTML(key)}" placeholder="Заметка к паре" value="${escapeHTML(localStorage.getItem(`note:${key}`) || '')}"></div></article>`;
  });
  return output;
}

function bindScheduleCards() {
  document.querySelectorAll('[data-fav]').forEach(button => button.onclick = () => {
    const key = button.dataset.fav;
    favorites = favorites.includes(key) ? favorites.filter(item => item !== key) : [...favorites, key];
    localStorage.setItem('stepasha-favs', JSON.stringify(favorites));
    load();
  });
  document.querySelectorAll('[data-note]').forEach(input => input.onchange = () => {
    localStorage.setItem(`note:${input.dataset.note}`, input.value);
  });
  document.querySelectorAll('[data-name]').forEach(button => button.onclick = () => {
    selectedName = button.dataset.name;
    load();
  });
  document.querySelector('[data-back]')?.addEventListener('click', () => {
    selectedName = '';
    load();
  });
}

function renderFavorites() {
  const html = favorites.map(key => `<div class="listitem"><span>★ ${escapeHTML(key.split('|').slice(-2).join(' · '))}</span><span>Сохранено</span></div>`).join('');
  $('#college').textContent = `${data.college || 'Колледж'} · учебный помощник`;
  $('#dateLabel').textContent = 'Твои пары';
  $('#dateSub').textContent = `Сохранено: ${favorites.length}`;
  $('#groupWrap').hidden = $('#quick').hidden = $('#datebar').hidden = $('#searchWrap').hidden = true;
  $('#sectionLabel').textContent = 'СОХРАНЁННОЕ';
  $('#title').textContent = 'Сохранённые пары';
  $('#content').innerHTML = html || empty('Список пока пуст');
  updateHero();
}

function renderTools() {
  const average = grades.length ? (grades.reduce((sum, grade) => sum + Number(grade.value), 0) / grades.length).toFixed(2) : '—';
  const taskHTML = tasks.map((task, index) => `<div class="tool-row"><label><input type="checkbox" data-task="${index}" ${task.done ? 'checked' : ''}> ${escapeHTML(task.title)}${task.subject ? ` · ${escapeHTML(task.subject)}` : ''}${task.due ? ` <small>до ${escapeHTML(task.due)}</small>` : ''}</label><button data-delete-task="${index}">×</button></div>`).join('') || '<p>Добавь первое задание — срок будет под рукой.</p>';
  const gradeHTML = grades.map((grade, index) => `<div class="tool-row"><span>${escapeHTML(grade.subject || 'Оценка')} · <b>${escapeHTML(grade.value)}</b></span><button data-delete-grade="${index}">×</button></div>`).join('');
  const eventHTML = studyEvents.map((event, index) => `<div class="tool-row"><span>${escapeHTML(event.date)} · ${escapeHTML(event.title)}</span><button data-delete-event="${index}">×</button></div>`).join('') || '<p>Добавь контрольную, зачёт или важную дату.</p>';

  $('#college').textContent = `${data.college || 'Колледж'} · учебный помощник`;
  $('#dateLabel').textContent = 'Твой кабинет';
  $('#dateSub').textContent = 'Личные данные хранятся на устройстве';
  $('#groupWrap').hidden = $('#quick').hidden = $('#datebar').hidden = $('#searchWrap').hidden = true;
  $('#sectionLabel').textContent = 'МОИ ИНСТРУМЕНТЫ';
  $('#title').textContent = 'Для учёбы';
  $('#content').innerHTML = `<div class="tools-grid">
    <section class="tool-card"><h3>Задания</h3><p>Предмет, срок и отметка о выполнении</p><form class="tool-form" id="taskForm"><input name="title" required placeholder="Что сделать?"><input name="subject" placeholder="Предмет"><input name="due" type="date" aria-label="Срок"><button class="action">Добавить</button></form>${taskHTML}</section>
    <section class="tool-card"><h3>Средний балл</h3><div class="average">${average}<small>${grades.length} оценок</small></div><form class="tool-form" id="gradeForm"><input name="subject" placeholder="Предмет"><input name="value" type="number" min="2" max="5" step="1" required placeholder="2–5"><button class="action">Записать</button></form>${gradeHTML}</section>
    <section class="tool-card"><h3>Учебный календарь</h3><p>Контрольные, зачёты и даты сдачи</p><form class="tool-form" id="eventForm"><input name="title" required placeholder="Событие"><input name="date" type="date" required><button class="action">Добавить</button></form>${eventHTML}</section>
    <section class="tool-card"><h3>Экспорт дня</h3><p>Сохрани расписание выбранного дня в календарь телефона.</p><button class="action" id="exportDay">Добавить в календарь</button></section>
  </div>`;
  bindTools();
  updateHero();
}

function bindTools() {
  $('#taskForm').onsubmit = event => {
    event.preventDefault(); const fields = new FormData(event.currentTarget);
    tasks.push({ title: fields.get('title').trim(), subject: fields.get('subject').trim(), due: fields.get('due'), done: false });
    localStorage.setItem('stepasha-tasks', JSON.stringify(tasks)); renderTools();
  };
  $('#gradeForm').onsubmit = event => {
    event.preventDefault(); const fields = new FormData(event.currentTarget);
    grades.push({ subject: fields.get('subject').trim(), value: Number(fields.get('value')) });
    localStorage.setItem('stepasha-grades', JSON.stringify(grades)); renderTools();
  };
  $('#eventForm').onsubmit = event => {
    event.preventDefault(); const fields = new FormData(event.currentTarget);
    studyEvents.push({ title: fields.get('title').trim(), date: fields.get('date') });
    studyEvents.sort((a, b) => a.date.localeCompare(b.date));
    localStorage.setItem('stepasha-events', JSON.stringify(studyEvents)); renderTools();
  };
  document.querySelectorAll('[data-task]').forEach(input => input.onchange = () => {
    tasks[Number(input.dataset.task)].done = input.checked;
    localStorage.setItem('stepasha-tasks', JSON.stringify(tasks)); renderTools();
  });
  [['[data-delete-task]', tasks, 'stepasha-tasks', 'deleteTask'], ['[data-delete-grade]', grades, 'stepasha-grades', 'deleteGrade'], ['[data-delete-event]', studyEvents, 'stepasha-events', 'deleteEvent']].forEach(([selector, list, storageKey, dataKey]) => {
    document.querySelectorAll(selector).forEach(button => button.onclick = () => {
      list.splice(Number(button.dataset[dataKey]), 1);
      localStorage.setItem(storageKey, JSON.stringify(list)); renderTools();
    });
  });
  $('#exportDay').onclick = exportDay;
}

function exportDay() {
  if (!data.rows?.length) return alert('Нет пар для экспорта. Сначала открой день с расписанием.');
  const date = toISO(day).replaceAll('-', ''), pad = number => String(number).padStart(2, '0');
  const clock = value => { const match = String(value || '').match(/(\d{1,2}):(\d{2})/); return match ? `${date}T${pad(match[1])}${match[2]}00` : date; };
  const clean = text => String(text || '').replace(/\\/g, '\\\\').replace(/\n/g, '\\n').replace(/,/g, '\\,').replace(/;/g, '\\;');
  const entries = data.rows.map((row, index) => `BEGIN:VEVENT\r\nUID:${date}-${index}@stepasha\r\nDTSTART:${clock(row.start)}\r\nDTEND:${clock(row.end)}\r\nSUMMARY:${clean(row.subject || row.lesson || 'Занятие')}\r\nDESCRIPTION:${clean([row.teacher, row.room, row.group].filter(Boolean).join(' · '))}\r\nEND:VEVENT`).join('\r\n');
  const file = new Blob([`BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//Stepasha//Schedule//RU\r\n${entries}\r\nEND:VCALENDAR`], { type: 'text/calendar;charset=utf-8' });
  const link = document.createElement('a'); link.href = URL.createObjectURL(file); link.download = `stepasha-${date}.ics`; link.click(); URL.revokeObjectURL(link.href);
}

document.querySelectorAll('[data-section]').forEach(button => button.onclick = () => setSection(button.dataset.section));
$('#group').onchange = event => { selectedGroup = event.target.value; load(); };
$('#prev').onclick = () => { day.setDate(day.getDate() - 1); load(); };
$('#next').onclick = () => { day.setDate(day.getDate() + 1); load(); };
$('#tomorrow').onclick = () => { day = new Date(); day.setDate(day.getDate() + 1); setSection('schedule'); };
$('#nextWeek').onclick = () => { day = new Date(); day.setDate(day.getDate() - day.getDay() + 8); setSection('week'); };
$('#refresh').onclick = () => load();
let searchTimer;
$('#search').oninput = () => { clearTimeout(searchTimer); selectedName = ''; searchTimer = setTimeout(load, 220); };
setInterval(() => { if (section === 'schedule') updateHero(); }, 30000);
load();

</script>
</body>
</html>
