<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#111214"><title>Степаша · расписание</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{color-scheme:dark;--ink:#f4f3f0;--muted:#aaa9a7;--panel:rgba(255,255,255,.075);--line:rgba(255,255,255,.12);--hot:#ff6c3d;--cyan:#78e0cf;--violet:#c1a5ff;--black:#101113}*{box-sizing:border-box}body{margin:0;font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:radial-gradient(ellipse at 8% 2%,#28241f 0,transparent 34%),radial-gradient(ellipse at 100% 25%,#1b2630 0,transparent 38%),#101113;min-height:100vh}button,input,select{font:inherit;color:inherit}main{max-width:680px;margin:auto;padding:16px 16px 112px}.top{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-radius:27px;background:linear-gradient(135deg,#242527e8,#17181adf);border:1px solid var(--line);box-shadow:0 15px 45px #0008;backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px)}.brand{display:flex;align-items:center;gap:12px}.brandmark{width:38px;height:38px;display:grid;place-items:center;border-radius:13px;background:linear-gradient(145deg,var(--hot),#ffbb74);font-size:20px;box-shadow:0 5px 18px #ff704144}.top h1{font-size:18px;letter-spacing:-.35px;margin:0}.sub{font-size:12px;color:var(--muted);margin-top:2px}.avatar{width:42px;height:42px;border-radius:15px;background:#ffffff12;border:1px solid var(--line);display:grid;place-items:center;font-size:21px}.welcome{margin:25px 3px 17px}.eyebrow{font-size:11px;letter-spacing:1.3px;text-transform:uppercase;color:var(--muted)}.welcome h2{font-size:27px;line-height:1.12;letter-spacing:-1px;margin:5px 0}.welcome p{margin:5px 0;color:var(--muted);font-size:13px}.tabs{display:flex;gap:8px;margin:17px 0;overflow:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{border:1px solid transparent;border-radius:14px;padding:10px 13px;background:transparent;color:#aaa;font-weight:650;white-space:nowrap;transition:.2s}.tab.active{background:#ffffff12;border-color:#ffffff10;color:#fff}.glass{background:linear-gradient(145deg,rgba(255,255,255,.095),rgba(255,255,255,.045));border:1px solid var(--line);box-shadow:0 18px 45px #0005;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:26px;padding:18px;margin:12px 0;animation:rise .34s cubic-bezier(.2,.8,.2,1) both}.heading{display:flex;align-items:center;justify-content:space-between;gap:10px}.heading h2{margin:0;font-size:20px;letter-spacing:-.4px}.search{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:16px;background:#ffffff0c;outline:none;margin:14px 0;color:var(--ink)}.search::placeholder{color:#888}.search:focus{border-color:#ff805f88;box-shadow:0 0 0 3px #ff805f1a}.datebar{display:flex;justify-content:space-between;align-items:center;margin:16px 0 7px;padding:8px 10px;border-radius:17px;background:#ffffff08}.datebar button,.select{border:1px solid var(--line);background:#ffffff0c;border-radius:12px;padding:9px 12px;color:var(--ink)}.datebar button{width:39px;height:38px;font-size:20px}.datebar b{text-transform:capitalize;font-size:13px}.lesson{position:relative;padding:15px 15px 14px;border-radius:19px;margin-top:10px;background:rgba(255,255,255,.055);border:1px solid #ffffff0b;transition:transform .2s,border-color .2s}.lesson:hover{transform:translateY(-2px);border-color:#ffffff25}.lesson:first-child{background:linear-gradient(130deg,#ff704020,#ffffff06 65%);border-color:#ff805f30}.row{display:flex;gap:9px;align-items:center;justify-content:space-between}.row b{font-size:14px;line-height:1.35}.star{flex:none;border:1px solid var(--line);background:#ffffff0c;border-radius:11px;font-size:19px;padding:5px 9px;color:#ffc66d}.meta{font-size:12px;color:var(--muted);margin-top:5px}.time-pill{display:inline-flex;padding:5px 9px;border-radius:9px;background:#78e0cf17;color:#92e8d7;font-size:12px;font-weight:700}.empty,.hint{text-align:center;color:var(--muted);padding:28px 18px}.listitem{width:100%;text-align:left;padding:14px;border:1px solid #ffffff0c;border-radius:16px;background:#ffffff08;margin:7px 0;display:flex;justify-content:space-between;align-items:center;transition:.18s}.listitem:active{transform:scale(.985);background:#ffffff12}.bottom{position:fixed;bottom:0;left:0;right:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(0deg,#101113f5,#101113c9);backdrop-filter:blur(22px);display:flex;justify-content:center}.bottom nav{width:min(100%,440px);display:flex;justify-content:space-around;gap:6px;padding:7px;background:rgba(42,43,46,.84);border:1px solid var(--line);border-radius:20px;box-shadow:0 12px 30px #0008}.bottom button{min-width:68px;border:0;background:transparent;padding:9px 13px;border-radius:14px;font-size:18px;color:#aaa;transition:.2s}.bottom button.active{background:linear-gradient(135deg,#ff7547,#ff9e67);color:white;box-shadow:0 5px 18px #ff704133}.select{max-width:145px;font-size:12px}.select option{background:#202124;color:#fff}@keyframes rise{from{opacity:0;transform:translateY(11px)}to{opacity:1;transform:none}}@media(min-width:600px){main{padding-top:28px}.welcome h2{font-size:32px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;scroll-behavior:auto!important;transition:none!important}}
</style></head>
<body><main>
<header class="top"><div class="brand"><div class="brandmark">🐶</div><div><h1>СТЕПАША</h1><div class="sub" id="college">Твой колледж · помощник</div></div></div><div class="avatar">🔔</div></header>
<section class="welcome"><div class="eyebrow">ТВОЙ УЧЕБНЫЙ ДЕНЬ</div><h2>Всё по полочкам.</h2><p>Расписание, преподаватели и нужные кабинеты — рядом.</p></section>
<div class="tabs" id="tabs"><button class="tab active" data-section="schedule">Сегодня</button><button class="tab" data-section="teachers">Преподаватели</button><button class="tab" data-section="rooms">Кабинеты</button><button class="tab" data-section="favorites">Избранное</button></div>
<section class="glass"><div class="heading"><h2 id="title">Моё расписание</h2><select id="group" class="select" hidden></select></div><input class="search" id="search" placeholder="Поиск группы…" hidden><div class="datebar"><button id="prev">‹</button><b id="dateLabel">Сегодня</b><button id="next">›</button></div><div id="content"><div class="hint">Загружаю расписание…</div></div></section>
</main><footer class="bottom"><nav><button class="active" data-section="schedule">🏠</button><button data-section="teachers">🔎</button><button data-section="favorites">⭐</button></nav></footer>
<script>
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();const initData=tg?.initData||'';let section='schedule',day=new Date(),data={items:[],rows:[]},selectedName='',selectedGroup='',favorites=JSON.parse(localStorage.getItem('stepasha-favs')||'[]');
const $=s=>document.querySelector(s);const dateISO=d=>{const x=new Date(d.getTime()-d.getTimezoneOffset()*60000);return x.toISOString().slice(0,10)};function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){if(section==='favorites'){renderFavorites();return}const params=new URLSearchParams({section,date:dateISO(day)});if(section==='schedule'&&selectedGroup)params.set('group',selectedGroup);if((section==='teachers'||section==='rooms')&&selectedName)params.set('name',selectedName);const q=$('#search').value.trim();if(q)params.set('q',q);try{const r=await fetch('/api/miniapp?'+params,{headers:{'X-Telegram-Init-Data':initData}});data=await r.json();if(!r.ok)throw Error(data.error||'Не удалось загрузить данные');render()}catch(e){$('#content').innerHTML=`<div class="empty">${esc(e.message)}<br><small>Открой Mini App из Telegram и выбери группу в боте.</small></div>`}}
function render(){const names=data.items||[];$('#college').textContent=(data.college||'')+' · расписание';$('#dateLabel').textContent=new Intl.DateTimeFormat('ru-RU',{weekday:'long',day:'numeric',month:'long'}).format(day);$('#group').hidden=section!=='schedule';$('#search').hidden=section==='schedule';$('#search').placeholder=section==='teachers'?'Найти преподавателя…':'Найти кабинет…';if(section==='schedule'){const sel=$('#group');sel.innerHTML='<option value="">Моя группа</option>'+names.map(n=>`<option>${esc(n)}</option>`).join('');if(selectedGroup)sel.value=selectedGroup;$('#title').textContent='Моё расписание'}else{$('#title').textContent=section==='teachers'?'Преподаватели':section==='rooms'?'Кабинеты':'Избранное'}let html='';if(section!=='schedule'&&!selectedName){html=names.map(n=>`<button class="listitem" data-name="${esc(n)}"><span>${esc(n)}</span><span>›</span></button>`).join('')||'<div class="empty">Ничего не найдено</div>'}else{const rows=data.rows||[];html=rows.map(r=>{const key=[section,selectedName||selectedGroup,r.date,r.lesson_no,r.subject].join('|');return `<article class="lesson"><div class="row"><b>${esc(r.lesson_no||'—')} пара · ${esc(r.subject||'Занятие')}</b><button class="star" data-fav="${esc(key)}">${favorites.includes(key)?'★':'☆'}</button></div><div class="meta"><span class="time-pill">${esc(r.start||'Время не указано')}${r.end?' — '+esc(r.end):''}</span>　${esc(r.group||'')}</div><div class="meta">${esc(r.teacher||'')} ${r.room?'· '+esc(r.room):''}</div></article>`}).join('')||'<div class="empty">Занятий на этот день нет</div>'}$('#content').innerHTML=html;$('#content').querySelectorAll('[data-name]').forEach(b=>b.onclick=()=>{selectedName=b.dataset.name;load()});$('#content').querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const k=b.dataset.fav;favorites=favorites.includes(k)?favorites.filter(x=>x!==k):[...favorites,k];localStorage.setItem('stepasha-favs',JSON.stringify(favorites));render()})}
function renderFavorites(){$('#title').textContent='Избранное';$('#group').hidden=true;$('#search').hidden=true;$('#dateLabel').textContent='Сохранено на устройстве';$('#content').innerHTML=favorites.map(f=>`<div class="listitem">⭐ ${esc(f.split('|').slice(0,3).join(' · '))}</div>`).join('')||'<div class="empty">Пока пусто. Нажми ☆ возле занятия.</div>'}
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{section=b.dataset.section;selectedName='';document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.section===section));document.querySelectorAll('.bottom button').forEach(t=>t.classList.toggle('active',t.dataset.section===section));load()});$('#prev').onclick=()=>{day.setDate(day.getDate()-1);load()};$('#next').onclick=()=>{day.setDate(day.getDate()+1);load()};$('#group').onchange=e=>{selectedGroup=e.target.value;load()};let timer;$('#search').oninput=()=>{clearTimeout(timer);selectedName='';timer=setTimeout(load,250)};load();
</script></body></html>
